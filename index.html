    />
    <meta property="og:title" content="LiveCode — A Visual Code Learning Platform" />
    <meta
      property="og:description"
      content="Yozgan kodingiz qanday ishlashini qadamma-qadam ko'ring: o'zgaruvchilar, massivlar, izohlar. Boshlovchilar uchun, o'zbek, rus va ingliz tillarida."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://livecode-chi.vercel.app/" />
    <!-- Apply the saved (or system) theme before the first paint, so a dark-mode
         reload doesn't flash white. Same key and logic as src/store/settingsStore.ts. -->
    <script>
      try {
        var theme = localStorage.getItem('codevision.theme')
        if (theme !== 'light' && theme !== 'dark') {
          theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.dataset.theme = theme
      } catch (error) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
