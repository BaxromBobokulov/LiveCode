<!doctype html>
<html lang="uz">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/" href="/src/assets/pictures/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="icon" href="./src/assets/pictures/favicon.png" type="image/png">
    <link
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <!-- Uzbek is the main audience. The app swaps the title and lang to the chosen language at runtime
         (applyLocale in src/store/settingsStore.ts); crawlers and link previews read what is here. -->
    <title>LiveCode — Kodni vizual o'rganish platformasi</title>
    <link rel="canonical" href="https://livecode.uz/" />
    <meta
      name="description"
      content="Yozgan kodingiz qanday ishlashini qadamma-qadam ko'ring: o'zgaruvchilar, massivlar, izohlar. Boshlovchilar uchun, o'zbek, rus va ingliz tillarida."
    />
    <meta property="og:title" content="LiveCode — Kodni vizual o'rganish platformasi" />
    <meta
      property="og:description"
      content="Yozgan kodingiz qanday ishlashini qadamma-qadam ko'ring: o'zgaruvchilar, massivlar, izohlar. Boshlovchilar uchun, o'zbek, rus va ingliz tillarida."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://livecode.uz/" />
    <meta property="og:site_name" content="LiveCode" />
    <meta property="og:locale" content="uz_UZ" />
    <meta property="og:locale:alternate" content="ru_RU" />
    <meta property="og:locale:alternate" content="en_US" />
    <!-- Made from scripts/og-image/og-image.html, see the README there -->
    <meta property="og:image" content="https://livecode.uz/og-image.png" />
    <meta property="og:image:type" content="image/png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="LiveCode: kodingiz qanday ishlashini qadamma-qadam ko'ring" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Apply the saved (or system) theme before the first paint, so a dark-mode
         reload doesn't flash white. Same key and logic as src/store/settingsStore.ts. -->
    <script>
      try {
        // The old "codevision.theme" key too, for the first load before src/lib/migrateStorage.ts renames it.
        var theme = localStorage.getItem('livecode.theme') || localStorage.getItem('codevision.theme')
        if (theme !== 'light' && theme !== 'dark') {
          theme = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'
        }
        document.documentElement.dataset.theme = theme
      } catch (error) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
